<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f3460">
  <meta name="description" content="Parole Mutanti — gioco multiplayer realtime">
  <title>Parole Mutanti</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <!-- Header fisso -->
  <header class="app-header">
    <h1 class="app-logo">🎮 Parole Mutanti</h1>
    <div class="app-status">
      <span id="connection-status" class="status-dot status-offline" title="Connessione"></span>
      <button id="theme-toggle" class="icon-btn" title="Cambia tema">🌙</button>
      <button id="sound-toggle" class="icon-btn" title="Audio">🔊</button>
    </div>
  </header>

  <!-- Main: qui vengono renderizzate le view -->
  <main id="app" class="app-main">
    <!-- Loading iniziale -->
    <div class="loading">Caricamento…</div>
  </main>

  <!-- Socket.io client (via npm, importato in main.js) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
